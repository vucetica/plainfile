name: Plainfile
options:
  bundleIdPrefix: app.plainfile
  deploymentTarget:
    macOS: "26.0"
  xcodeVersion: "27.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

packages:
  swift-markdown:
    url: https://github.com/swiftlang/swift-markdown
    from: "0.5.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: "YES"
    SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: "YES"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: "YES"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
    DEAD_CODE_STRIPPING: "YES"

targets:
  Plainfile:
    type: application
    platform: macOS
    sources:
      - path: Plainfile
      - path: Samples
        type: folder
        buildPhase: resources
    dependencies:
      - package: swift-markdown
        product: Markdown
    settings:
      base:
        PRODUCT_NAME: Plainfile
        PRODUCT_BUNDLE_IDENTIFIER: app.plainfile.Plainfile
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: "NO"
        INFOPLIST_FILE: Plainfile/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        COMBINE_HIDPI_IMAGES: "YES"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
        ENABLE_APP_SANDBOX: "YES"
        CODE_SIGN_ENTITLEMENTS: Plainfile/Resources/Plainfile.entitlements
    scheme:
      testTargets:
        - PlainfileTests
      gatherCoverageData: false

  PlainfileTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: PlainfileTests
    dependencies:
      - target: Plainfile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.plainfile.PlainfileTests
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Plainfile.app/Contents/MacOS/Plainfile"
        BUNDLE_LOADER: "$(TEST_HOST)"
